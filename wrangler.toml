# 명령어(wrangler)로 배포할 때만 쓰는 설정 파일이에요.
# Cloudflare 대시보드에서 직접 배포한다면 이 파일은 필요 없어요.
name = "knowhow-village"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "knowhow-village-db"
database_id = "여기에-D1-데이터베이스-ID를-붙여넣으세요"

[[r2_buckets]]
binding = "FILES"
bucket_name = "knowhow-village-files"
