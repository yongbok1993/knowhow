# GitHub 자동 배포(Workers Builds)와 wrangler 명령어가 쓰는 설정 파일이에요.
# main 브랜치에 합쳐지면 Cloudflare가 이 설정대로 knowhow-village Worker를 배포해요.
name = "knowhow-village"
main = "worker.js"
compatibility_date = "2026-09-01"
# 대시보드에서 넣은 변수(Variables)를 배포 때 지우지 않도록 해요. 비밀값(Secret)은 원래 유지돼요.
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "knowhow-village-db"
database_id = "f6fe0dc6-6c9d-4afa-8d78-20a016c66abc"

# R2는 아직 켜지 않았어요. 홍보지·영상 파일 올리기가 필요해지면 R2를 켜고 아래 세 줄의 # 을 지우세요.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "knowhow-village-files"
